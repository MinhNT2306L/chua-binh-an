<meta property="og:title" content="Chốn Bình An">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f5f41'/%3E%3Cpath d='M16 7c-3 3-6 5-11 6 1.500 1.500 3 2 4 2h14c1 0 2.500-.5 4-2-5-1-8-3-11-6Z' fill='%23f0c25e'/%3E%3Cpath d='M10 15v10M22 15v10M7 25h18' stroke='%23fffaf0' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f5efe3">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--sky1:#bfe0f0;--sky2:#f3f1e4;--mt1:#c9d8c4;--mt2:#a9c4a2;--g1:#cfdcb0;--g2:#b8cc94;--path:#e9dcbd;--shade:0;--glow:0;
 --ink:#3a4432;--ink2:#655e4b;--cream:#f5efe3;--card:#fffaf0;--leaf:#4f5f41;--gold:#c89a3c;--line:#e4d9c3;--err:#a3462b;
 --on-sky:#2f3a2a;--on-sky2:#454e3b;--brand:#855a2a;--scrim:rgba(250,246,232,.74);
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--shadow:0 10px 34px rgba(46,38,24,.2);--panel:min(460px,38vw)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--cream);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,sans-serif}
body{overflow:hidden}
.serif{font-family:"Noto Serif",Georgia,serif}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* ===== Man dau: canh chua phu toan man hinh, noi dung nam tren canh ===== */
#landing{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;
 padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 16px);transition:opacity .8s,visibility 0s .8s}
#landing::before{content:"";position:fixed;left:0;right:0;top:0;height:48%;z-index:-1;pointer-events:none;
 background:linear-gradient(var(--scrim) 45%,transparent)}
body.inside #landing{opacity:0;visibility:hidden;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--on-sky)}
.brand{font-size:22px;display:flex;align-items:center;gap:7px;white-space:nowrap}.brand b{color:var(--brand);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:1px solid currentColor;background:transparent;color:inherit;padding:0 13px;border-radius:24px;font-size:14px;white-space:nowrap}
.pill .ic{width:18px;height:18px}
.hero{color:var(--on-sky);text-align:center;margin:0 auto;max-width:560px}
.eyebrow{letter-spacing:.28em;font-size:11px;font-weight:600;margin-top:16px;color:var(--on-sky2)}
h1{font-size:clamp(24px,7.6vw,36px);line-height:1.22;margin-top:10px;font-weight:500;text-wrap:balance}
.sub{color:var(--on-sky2);font-size:15px;line-height:1.55;margin-top:10px}
.spacer{flex:1 0 26vh}
#joinBox{width:100%;max-width:520px;margin:0 auto;background:rgba(255,250,240,.95);border-radius:24px;padding:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.live{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;line-height:1.35}
.live i{flex:none;width:10px;height:10px;border-radius:50%;background:#b7ad97}
.live.on i{background:#6f9c4e;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,156,78,.5)}80%,100%{box-shadow:0 0 0 9px rgba(111,156,78,0)}}
.muted{color:var(--ink2);font-size:13px;margin-top:3px}
#joinRow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
#joinName{flex:1 1 120px;min-width:0;min-height:48px;font:inherit;font-size:16px;padding:0 14px;border-radius:16px;border:1px solid #cfc3aa;background:#fff;color:var(--ink)}
#joinName::placeholder,#fMsg::placeholder{color:#7d7560}
#joinName[aria-invalid=true]{border-color:var(--err)}
#enter{flex:1 0 auto;min-height:48px;border:0;background:var(--leaf);color:#fff;border-radius:16px;padding:0 18px;font-size:15px;font-weight:600;white-space:nowrap;transition:background .2s}
#enter:hover{background:#43523a}
#joinNote{color:var(--err);font-size:13px;margin-top:8px}#joinNote:empty{display:none}
/* Man rong: bang ben trai, canh dich sang phai cho can giua khoang con lai */
@media (min-width:900px),(min-width:560px) and (min-aspect-ratio:5/4){
 #landing{--on-sky:var(--ink);--on-sky2:var(--ink2);--brand:#855a2a;right:auto;width:var(--panel);min-width:340px;padding:calc(var(--st) + 24px) 32px calc(var(--sb) + 24px);
  background:#faf6ea;box-shadow:8px 0 40px rgba(46,38,24,.16)}
 #landing::before{display:none}
 .hero{text-align:left;margin:auto 0 0;max-width:none}.spacer{flex:0 0 22px}
 #joinBox{margin:0 0 auto;max-width:none;box-shadow:none;background:var(--card)}
 h1{font-size:clamp(26px,2.7vw,38px)}
 body:not(.inside) #san,body:not(.inside) #dien{transform:translateX(calc(max(var(--panel),340px) / 2))}
}
@media (max-height:620px){.sub{display:none}.eyebrow{margin-top:10px}}
#landing{overflow-x:hidden}
@media (max-width:360px),(max-height:480px){#snd1{padding:0;width:44px;justify-content:center}#snd1Txt{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}}
@media (max-height:480px){.eyebrow{display:none}h1{font-size:21px;margin-top:6px}#landing{padding:calc(var(--st) + 10px) 20px calc(var(--sb) + 10px)}.spacer{flex:0 0 10px}#joinBox{padding:10px 12px}#liveZ{display:none}#joinRow{margin-top:8px}#welcome{top:6%;padding:8px 18px}}
/* ===== San khau ===== */
#stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--sky2)}
#stage svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .9s}
#stage svg.off{opacity:0;pointer-events:none}
body.entering #san{transition:transform 1.2s cubic-bezier(.3,.7,.2,1),opacity .9s}
#san.walk{transition:transform 1.7s cubic-bezier(.55,0,.8,.4),opacity .6s 1.2s;opacity:0}
body.dien #stage{background:#1d0c06}
#canopy{transform-origin:118px 640px;animation:sway 7s ease-in-out infinite}
#canopy2{transform-origin:118px 520px;animation:sway 5s ease-in-out infinite reverse}
@keyframes sway{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
.lf{animation:flut 3s ease-in-out infinite}@keyframes flut{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
#broom{transform-origin:6px 2px;animation:sweep 1.6s ease-in-out infinite}@keyframes sweep{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
.cloud{animation:drift 300s linear infinite}@keyframes drift{from{transform:translateX(-1100px)}to{transform:translateX(1900px)}}
.rip{fill:none;stroke:#fff;stroke-opacity:.5;animation:rip 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate}@keyframes flick{to{transform:scale(.88,1.08)}}
.smoke{fill:none;stroke:#efe9df;stroke-width:1.4;stroke-linecap:round;opacity:0;animation:smoke 5s linear infinite}
@keyframes smoke{0%{opacity:0;transform:translateY(0)}15%{opacity:.5}100%{opacity:0;transform:translateY(-70px)}}
.night{opacity:var(--glow);transition:opacity 2s}
.tap{cursor:pointer;transition:filter .2s}.tap:hover{filter:brightness(1.12)}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 1.4s ease-out}
@keyframes swing{0%{transform:rotate(0)}15%{transform:rotate(-9deg)}40%{transform:rotate(6deg)}65%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
.knock{transform-box:fill-box;transform-origin:50% 100%;animation:knock .25s}@keyframes knock{50%{transform:scale(1.06,.94)}}
/* HUD */
.hud{position:fixed;z-index:8;display:none}
body.inside .hud{display:flex;animation:fadein .8s .5s backwards}
@keyframes fadein{from{opacity:0}}
#where{left:12px;top:calc(var(--st) + 12px)}
#tools{right:12px;top:calc(var(--st) + 12px)}
#where button,#tools button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;min-width:44px;border:0;background:rgba(255,250,240,.92);color:var(--ink);border-radius:22px;font-size:14px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.14)}
#where button{padding:0 14px 0 11px}
#where .ic,#tools .ic{width:20px;height:20px}
#bar{left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 12px);gap:2px;padding:6px;border-radius:26px;
 background:rgba(255,250,240,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow)}
#bar button{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:68px;min-height:60px;padding:6px 1px 5px;
 border:0;border-radius:20px;background:transparent;color:var(--ink);font-size:11.5px;font-weight:600;line-height:1.15;white-space:nowrap;transition:transform .15s,background .2s,opacity .2s}
#bar button:hover{background:rgba(79,95,65,.12)}
#bar button:active{transform:scale(.94)}
#bar #bGo{background:var(--leaf);color:#fff}
#bar #bGo:hover{background:#43523a}
#bar button.busy{opacity:.55}
#bar button.cool{color:var(--ink2)}
#bar button.cool::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:3px;border-radius:2px;background:var(--gold);transform-origin:left;animation:cool var(--cd) linear forwards}
@keyframes cool{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (max-width:360px){#bar button{width:58px;font-size:10px}#bar{padding:4px;gap:0}}
@media (max-height:480px){#bar button{min-height:46px;width:52px}#bar button span{display:none}}
/* Bang (loi nguyen, nguoi co mat) */
#scrimBg{position:fixed;inset:0;z-index:11;background:rgba(30,22,12,.38);opacity:0;pointer-events:none;transition:opacity .3s}
#scrimBg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:12;max-height:82%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;background:var(--card);outline:none;
 border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.28);padding-bottom:var(--sb);
 transform:translateY(105%);visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s .4s}
.sheet.open{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.hd{display:flex;justify-content:space-between;align-items:center;padding:10px 8px 4px 18px}.hd b{font-size:18px;font-weight:600}
.x{width:44px;height:44px;border:0;border-radius:50%;background:none;font-size:18px;color:var(--ink2)}.x:hover{background:rgba(79,95,65,.1)}
#form{padding:4px 18px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
#form textarea{font:inherit;font-size:16px;line-height:1.45;border:1px solid #cfc3aa;border-radius:14px;padding:11px 12px;background:#fff;color:var(--ink);resize:none;height:84px}
#form .row{display:flex;justify-content:space-between;align-items:center;gap:12px}#form small{color:var(--ink2);font-size:13px;line-height:1.35}
#form small.err{color:var(--err)}
#send{flex:none;min-height:44px;border:0;border-radius:22px;padding:0 26px;background:var(--leaf);color:#fff;font-weight:600}#send:disabled{opacity:.5}
.list{overflow-y:auto;padding:0 18px 16px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.msg{padding:12px 0;border-top:1px solid #efe5d2;position:relative}.msg:first-child{border-top:0}
.msg .n{font-weight:600;font-size:14px}.msg .t{color:var(--ink2);font-size:12px;margin-left:7px}
.msg p{margin-top:3px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.del{position:absolute;right:0;top:8px;border:0;background:#a83c28;color:#fff;border-radius:12px;font-size:12px;padding:4px 11px}
.empty{color:var(--ink2);text-align:center;padding:26px 0;font-size:14px;line-height:1.5}
#adm{border:0;background:none;color:var(--ink2);font-size:12px;padding:10px;align-self:center}
.grp{font-size:13px;color:var(--ink2);font-weight:600;margin:12px 0 7px}
.ppl{display:flex;flex-wrap:wrap;gap:6px}.ppl span{background:#eef2e4;border-radius:14px;padding:6px 12px;font-size:14px}.ppl span.me{background:var(--leaf);color:#fff}
@media (min-width:900px){
 .sheet{left:auto;right:0;top:0;width:430px;max-width:none;max-height:none;margin:0;border-radius:24px 0 0 24px;box-shadow:-10px 0 40px rgba(0,0,0,.28);transform:translateX(105%)}
}
#toast{position:fixed;left:50%;top:calc(var(--st) + 66px);transform:translate(-50%,-10px);opacity:0;z-index:20;width:max-content;max-width:min(88vw,460px);
 background:rgba(52,62,44,.94);color:#fff;padding:9px 16px;border-radius:18px;font-size:14px;line-height:1.4;transition:.4s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#welcome{position:fixed;left:50%;top:21%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);z-index:9;text-align:center;pointer-events:none;opacity:0;padding:16px 26px;border-radius:24px;
 background:rgba(44,32,20,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fffaf0;transition:opacity 1.4s}
#welcome.show{opacity:1}
#welcome small{display:block;letter-spacing:.26em;font-size:11px;font-weight:600;margin-bottom:8px;opacity:.9}
#welcome b{display:block;font-family:"Noto Serif",Georgia,serif;font-weight:500;font-size:clamp(20px,6vw,28px);line-height:1.3}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>

<div id="landing">
 <div class="top"><div class="brand serif">✻ <span><b>chốn</b> bình an</span></div><button class="pill" id="snd1" aria-pressed="true"><svg class="ic"><use id="snd1Ic" href="#i-music"/></svg><span id="snd1Txt">Âm thanh: bật</span></button></div>
 <div class="hero">

<div id="stage">
<!-- ================= SAN CHUA ================= -->
<svg id="san" aria-hidden="true" viewBox="0 -100 600 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient>
 <linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></linearGradient>
 <linearGradient id="gPond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fcfc6"/><stop offset="1" stop-color="#6fa9a3"/></linearGradient>
 <linearGradient id="gBell" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6420"/><stop offset=".45" stop-color="#d9ad52"/><stop offset="1" stop-color="#7a5418"/></linearGradient>
 <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd38a" stop-opacity=".95"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
 <path id="leaf" d="M0,-9C5,-10 8,-6 7,-1C6,4 2,7 0,13C-2,7 -6,4 -7,-1C-8,-6 -5,-10 0,-9Z"/>
 <g id="lotus"><path d="M0,0C-9,-4 -12,-12 -8,-16C-4,-10 -2,-6 0,0Z" fill="#f2a9b7"/><path d="M0,0C9,-4 12,-12 8,-16C4,-10 2,-6 0,0Z" fill="#f2a9b7"/><path d="M0,0C-4,-8 -3,-16 0,-20C3,-16 4,-8 0,0Z" fill="#f7c3cd"/></g>
 <clipPath id="cpPath"><path d="M282,492H318L450,900H150Z"/></clipPath>
</defs>
<rect x="-1500" y="-100" width="3600" height="660" fill="url(#gSky)"/>
<g id="stars" class="night"></g>
<circle id="sun" cx="440" cy="230" r="34" fill="#fbf0c4"/>

  const g = mk("g", { transform: `translate(${x} ${y}) scale(${sc})` }, par), c = COL[hsh(uid) % COL.length];
  mk("ellipse", { cx: 0, cy: 0, rx: 15, ry: 3.5, fill: "#000", opacity: .22 }, g);
  if (sit) mk("path", { d: "M-15,0Q-16,-14 -10,-22L10,-22Q16,-14 15,0Z", fill: c }, g);
  else { mk("path", { d: "M-10,-24L10,-24L13,0H-13Z", fill: c }, g); mk("rect", { x: -9, y: -3, width: 18, height: 3, fill: "#3a2a1a", opacity: .5 }, g); }
  const top = sit ? -22 : -24;
  mk("path", { d: `M-10,${top}Q-11,${top - 9} 0,${top - 10}Q11,${top - 9} 10,${top}Z`, fill: c }, g);
  mk("circle", { cx: 0, cy: top - 16, r: 7.5, fill: "#2a1e16" }, g);
  mk("ellipse", { cx: 0, cy: top - 9.5, rx: 3, ry: 2, fill: "#e8c39c" }, g);
  const hot = (recentHuong[uid] || 0) > now() - 20000;
  if (hot) {
    mk("line", { x1: 9, y1: top - 4, x2: 13, y2: top - 26, stroke: "#b5523a", "stroke-width": 1.2 }, g);
    mk("circle", { cx: 13, cy: top - 26, r: 5, fill: "url(#gGlow2)" }, g);
    mk("circle", { cx: 13, cy: top - 26, r: 1.4, fill: "#ff6a2a" }, g);
  }
  return top - 24;
}
function renderFigures() {
  const all = { ...people };
  const me = myUid || "me";
  if (entered && !all[me]) all[me] = { n: myName, z: scene };
  const by = { san: [], dien: [] };
  for (const u in all) (by[all[u].z] || by.san).push(u);
  // San
  const W = $("walkers"); W.innerHTML = "";
  const ms = assignSlots("san", by.san, SAN_SLOTS.length);
  by.san.map(u => [u, SAN_SLOTS[ms[u]]]).sort((a, b) => a[1][1] - b[1][1]).forEach(([u, [x, y]]) => {
    const sc = .9 + (y - 600) / 380, head = figure(W, x, y, sc, u, false);
    nameTag(W, x, y + head * sc - 4, all[u].n || "", 12 + (y - 600) / 40, u === me);
  });
  // Chinh dien
  const S = $("sitters"); S.innerHTML = "";
  const md = assignSlots("dien", by.dien, DIEN_SLOTS.length);
  by.dien.map(u => [u, DIEN_SLOTS[md[u]]]).sort((a, b) => b[1][1] - a[1][1]).forEach(([u, [X, z]]) => {
    const x = PX(X, z), y = PY(z) + 2 / z, sc = 1.75 / z, head = figure(S, x, y, sc, u, true);
    nameTag(S, x, y + head * sc - 3, all[u].n || "", Math.max(11, 22 / z), u === me);
  });
}
setInterval(renderFigures, 5000);
if (DEMO) setTimeout(() => {
  const N = ["Hương", "Minh Anh", "Đạt", "Thu Hà", "Tuấn", "Lan", "Phương", "Hải"];
  N.forEach((n, i) => people["demo" + i] = { n, z: i < 3 ? "san" : "dien" }); recentHuong.demo4 = now();
  msgs = [{ id: "d1", n: "Thu Hà", m: "Cầu mong gia đình bình an, mọi người luôn khoẻ mạnh.", t: now() - 240000 }, { id: "d2", n: "Tuấn", m: "Một tuần mới nhẹ nhàng cho cả nhà.", t: now() - 7200000 }];
  conn = "on"; renderMsgs(); renderPeople(); renderFigures();
}, 600);

/* ================= NEN HUONG ================= */
let huong = [], offset = 0;
const now = () => Date.now() + offset;
function drawHuong() {
  const g = $("sticks"); g.innerHTML = "";
  const live = huong.filter(h => now() - h.t < HUONG_MIN * 60000).slice(-15);
  live.forEach((h, i) => {
    const k = Math.max(0, 1 - (now() - h.t) / (HUONG_MIN * 60000)), c = (live.length - 1) / 2;
    const x = 300 + (i - c) * 2.6, top = 449 - (10 + 46 * k);
    const s = mk("g", { transform: `rotate(${(i - c) * 1.6} ${x} 451)` }, g);
    mk("line", { x1: x, y1: 451, x2: x, y2: top + 1.5, stroke: "#b5523a", "stroke-width": 1.2 }, s);
    mk("circle", { cx: x, cy: top, r: 1.4, fill: "#ff6a2a" }, s);
    mk("circle", { cx: x, cy: top, r: 4.5, fill: "url(#gCandle)" }, s);
    if (i % 2 === 0) mk("path", { d: `M${x},${top - 2}q-6,-12 0,-24q6,-12 0,-24`, class: "smoke", style: `animation-delay:-${(i * .9) % 5}s` }, s);
  });
}
setInterval(drawHuong, 30000);

/* ================= BANG ================= */
let msgs = null, isAdmin = false, fb = null, myUid = null, people = {};
const ago = (t) => { const m = (now() - t) / 60000; if (m < 1) return "vừa xong"; if (m < 60) return (m | 0) + " phút trước"; if (m < 1440) return (m / 60 | 0) + " giờ trước";
  const d = new Date(t); return d.getDate() + "/" + (d.getMonth() + 1); };
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
function renderMsgs() {
  const L = $("list"); L.innerHTML = "";
  if (!fb && !DEMO) { L.append(el("div", "empty", "Chưa kết nối được, thử lại sau nhé.")); return; }
  if (!msgs) { L.append(el("div", "empty", "Đang tải…")); return; }
  if (!msgs.length) { L.append(el("div", "empty", "Chưa có lời nguyện nào. Bạn hãy là người đầu tiên gửi một lời an yên nhé.")); }
  for (const m of msgs) {
    const d = el("div", "msg"); d.append(el("span", "n", m.n), el("span", "t", ago(m.t)), el("p", "", m.m));
    if (isAdmin) { const x = el("button", "del", "Xóa"); x.onclick = () => { if (confirm("Xóa lời nguyện của " + m.n + "?")) fb.remove(fb.ref(fb.db, "loinguyen/" + m.id)); }; d.append(x); }
    L.append(d);
  }
  $("adm").textContent = isAdmin ? "Thoát quản trị" : "Quản trị"; $("adm").hidden = !(isAdmin || Q.has("admin"));
}
let conn = "wait"; // wait | on | off
function renderPeople() {
  const all = Object.values(people), z = { san: [], dien: [] };
  for (const u in people) { const p = people[u]; (z[p.z] || z.san).push({ n: p.n, me: u === myUid }); }
  if (entered && DEMO) (z[scene] || z.san).push({ n: myName, me: true });
  const n = Math.max(entered ? 1 : 0, all.length);
  $("hudN").textContent = Math.max(1, n);
  $("liveT").textContent = conn === "wait" ? "Đang kết nối…" : conn === "off" ? "Chưa kết nối được, bạn vẫn có thể vào chùa" : n ? `${n} người đang có mặt` : "Chùa đang yên tĩnh, bạn hãy là người đầu tiên ghé nhé";
  $("live").classList.toggle("on", conn === "on" && n > 0);
  $("liveZ").hidden = !(conn === "on" && n > 0);
  $("liveZ").textContent = `Sân chùa ${z.san.length} · Chính điện ${z.dien.length}`;
  const P = $("ppl"); P.innerHTML = "";
  for (const k of ["san", "dien"]) {
    P.append(el("div", "grp", `${ZN[k]} · ${z[k].length}`));
    const w = el("div", "ppl"); z[k].forEach(p => w.append(el("span", p.me ? "me" : "", p.me ? p.n + " (bạn)" : p.n)));
    if (!z[k].length) w.append(el("span", "", "—")); P.append(w);
  }
}
let sheetFrom = null;
function openSheet(id) {
  const wasOpen = !!document.querySelector(".sheet.open");
  document.querySelectorAll(".sheet").forEach(s => s.classList.toggle("open", s.id === id));
  $("scrimBg").classList.toggle("show", !!id);
  for (const h of ["stage", "where", "tools", "bar"]) $(h).inert = !!id;
  if (id) { if (!wasOpen) sheetFrom = document.activeElement; $(id).focus({ preventScroll: true }); }
  else if (wasOpen && sheetFrom) { sheetFrom.focus({ preventScroll: true }); sheetFrom = null; }
}
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => openSheet(""));
$("scrimBg").onclick = () => openSheet("");
addEventListener("keydown", e => { if (e.key === "Escape" && document.querySelector(".sheet.open")) openSheet(""); });
$("bLoi").onclick = () => { openSheet("sheetLoi"); renderMsgs(); msgHint(); };
$("bPeople").onclick = () => { openSheet("sheetPpl"); renderPeople(); };

/* ================= HANH DONG ================= */
const cd = {};
function cool(btn, ms) { // thanh tien trinh mong tren nut trong thoi gian cho
  btn.classList.remove("cool"); void btn.offsetWidth; btn.style.setProperty("--cd", ms + "ms"); btn.classList.add("cool");
  clearTimeout(btn.coolT); btn.coolT = setTimeout(() => btn.classList.remove("cool"), ms);
}
function ring(k) {
  if ((cd[k] || 0) > Date.now()) return; cd[k] = Date.now() + (k === "mo" ? 300 : 4000);
  sound(k); if (k === "lon") anim("bigBell", "swing"); else if (k === "nho") anim("bowlBody", "knock"); else anim("moBody", "knock");
  if (k !== "mo") cool($("bBell"), 4000);
  if (fb && myUid && k !== "mo") fb.push(fb.ref(fb.db, "bells"), { u: myUid, n: myName, k, t: fb.serverTimestamp() }).catch(() => {});
}
$("bBell").onclick = () => ring(scene === "san" ? "lon" : "nho");
$("bMo").onclick = () => ring("mo");
$("belfry").onclick = () => { if (entered) ring("lon"); };
$("bowl").onclick = () => ring("nho");
$("mo").onclick = () => ring("mo");
let cdHuong = 0, huongT;
$("bHuong").onclick = () => {
  if (scene !== "dien") go("dien");
  if (Date.now() < cdHuong) { toast("Nén hương của bạn đang cháy 🙏"); return; }
  cdHuong = Date.now() + 60000; cool($("bHuong"), 60000); $("bHuongT").textContent = "Đang cháy";
  const reset = () => { $("bHuongT").textContent = "Thắp hương"; }; clearTimeout(huongT); huongT = setTimeout(reset, 60000);
  const after = () => { toast("Bạn vừa thắp một nén hương 🙏"); recentHuong[myUid || "me"] = now(); renderFigures(); };
  if (fb && myUid) fb.push(fb.ref(fb.db, "huong"), { u: myUid, n: myName, t: fb.serverTimestamp() }).then(after).catch(() => {
    cdHuong = 0; $("bHuong").classList.remove("cool"); reset(); toast("Chưa thắp được hương, bạn thử lại nhé");
  });
  else { huong.push({ t: now() }); drawHuong(); after(); }
};
function msgHint() { const n = $("fMsg"), note = $("fNote"); note.classList.remove("err"); note.textContent = n.value.length ? `${n.value.length}/300` : `Gửi với tên ${myName}`; }
$("fMsg").addEventListener("input", msgHint);
$("fMsg").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("send").click(); });
$("send").onclick = async () => {
  const m = $("fMsg").value.trim();
  const fail = t => { $("fNote").classList.add("err"); $("fNote").textContent = t; };
  if (!m) { fail("Vui lòng nhập lời nguyện"); $("fMsg").focus(); return; }
  if (DEMO) { msgs = [{ id: "d" + Date.now(), n: myName, m, t: now() }, ...(msgs || [])]; renderMsgs(); $("fMsg").value = ""; msgHint(); toast("Đã gửi lời nguyện của bạn 🙏"); return; }
  if (!fb || !myUid) { fail("Chưa kết nối được"); return; }
  $("send").disabled = true; $("fNote").textContent = "";
  try { await fb.push(fb.ref(fb.db, "loinguyen"), { u: myUid, n: myName, m, t: fb.serverTimestamp() }); $("fMsg").value = ""; msgHint(); $("list").scrollTop = 0; toast("Đã gửi lời nguyện của bạn 🙏"); }
  catch (e) { fail("Gửi chưa được, thử lại nhé"); }
  $("send").disabled = false;
};

/* ================= FIREBASE ================= */
let presRef = null, offConn = null;
async function initFirebase() {
  try {
    const [A, U, D] = await Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-database.js")]);
    const app = A.initializeApp(cfg), auth = U.getAuth(app), db = D.getDatabase(app);
    fb = { ...U, ...D, auth, db };
    D.onValue(D.ref(db, ".info/serverTimeOffset"), s => offset = s.val() || 0);
    U.onAuthStateChanged(auth, async user => {
      if (!user) { U.signInAnonymously(auth).catch(() => {}); return; }
      if (presRef) { offConn && offConn(); await D.remove(presRef).catch(() => {}); presRef = null; }
      myUid = user.uid; isAdmin = user.email === ADMIN; renderMsgs();
      if (entered) startPresence();
      if (!initFirebase.on) { initFirebase.on = true; listen(); }
    });
  } catch (e) { console.warn("Firebase", e); fb = null; conn = "off"; renderMsgs(); renderPeople(); }
}
function presVal() { return { n: myName, z: scene, t: fb.serverTimestamp() }; }
function startPresence() {
  if (!fb || !myUid || presRef) return;
  presRef = fb.ref(fb.db, "presence/" + myUid);
  offConn = fb.onValue(fb.ref(fb.db, ".info/connected"), s => {
    if (s.val() !== true) return;
    fb.onDisconnect(presRef).remove().then(() => fb.set(presRef, presVal())).catch(() => {});
  });
}
function updatePresence() { if (fb && presRef) fb.set(presRef, presVal()).catch(() => {}); }
function listen() {
  const { db, ref, query, orderByChild, startAt, limitToLast, onValue, onChildAdded } = fb;
  let first = true;
  onValue(ref(db, "presence"), s => {
    const nx = {}; s.forEach(c => { nx[c.key] = c.val(); });
    if (!first && entered) for (const k in nx) if (!people[k] && k !== myUid) toast(`${nx[k].n} vừa ghé chùa`);
    people = nx; first = false; conn = "on"; renderPeople(); renderFigures();
  });
  const t0 = now();
  onChildAdded(query(ref(db, "bells"), orderByChild("t"), startAt(t0)), s => {
    const v = s.val(); if (!v || v.u === myUid || !entered) return;
    sound(v.k); if (v.k === "lon") anim("bigBell", "swing"); else anim("bowlBody", "knock");
    toast(`${v.n} vừa thỉnh chuông`);
  });
  onValue(query(ref(db, "huong"), orderByChild("t"), startAt(t0 - HUONG_MIN * 60000)), s => {
    huong = []; s.forEach(c => { const v = c.val(); huong.push(v); if (v.u) recentHuong[v.u] = Math.max(recentHuong[v.u] || 0, v.t); }); drawHuong(); renderFigures();
  });
  onChildAdded(query(ref(db, "huong"), orderByChild("t"), startAt(t0)), s => {
    const v = s.val(); if (v && v.u !== myUid && entered) toast(`${v.n} vừa thắp hương`);
  });
  onValue(query(ref(db, "loinguyen"), orderByChild("t"), limitToLast(80)), s => {
    const a = []; s.forEach(c => { a.push({ id: c.key, ...c.val() }); }); a.reverse();
    if (msgs && entered && a[0] && a[0].u !== myUid && !msgs.find(m => m.id === a[0].id)) toast(`${a[0].n} vừa gửi lời nguyện`);
    msgs = a; renderMsgs();
  });
}
$("adm").onclick = async () => {
  if (!fb) return;
  if (isAdmin) { await fb.signOut(fb.auth); toast("Đã thoát quản trị"); return; }
  try { const r = await fb.signInWithPopup(fb.auth, new fb.GoogleAuthProvider());
    if (r.user.email !== ADMIN) { toast("Tài khoản này không có quyền quản trị"); await fb.signOut(fb.auth); } else toast("Đã vào chế độ quản trị"); }
  catch (e) { if (e.code === "auth/popup-blocked") fb.signInWithRedirect(fb.auth, new fb.GoogleAuthProvider()); }
};
if (!DEMO) { initFirebase(); setTimeout(() => { if (conn === "wait") { conn = "off"; renderPeople(); } }, 10000); }
renderPeople();

/* ================= VAO CHUA ================= */
try { $("joinName").value = localStorage.getItem("cba_name") || ""; } catch (e) {}
setSound(soundOn);
$("joinName").addEventListener("keydown", e => { if (e.key === "Enter") $("enter").click(); });
$("joinName").addEventListener("input", () => { $("joinNote").textContent = ""; $("joinName").removeAttribute("aria-invalid"); });
$("enter").onclick = () => {
  const n = $("joinName").value.trim().replace(/\s+/g, " ");
  if (!n) { $("joinNote").textContent = "Nhập tên để mọi người biết bạn đã ghé nhé."; $("joinName").setAttribute("aria-invalid", "true"); $("joinName").focus(); return; }
  myName = n; try { localStorage.setItem("cba_name", n); } catch (e) {}
  entered = true; audio(); ac.resume && ac.resume();
  if (soundOn) { music.volume = .6; music.play().catch(() => {}); }
  setMoving(true); document.body.classList.add("entering", "inside"); $("landing").inert = true; document.activeElement.blur();
  setTimeout(() => { document.body.classList.remove("entering"); setMoving(false); }, 1300);
  startPresence(); renderPeople(); renderFigures(); hint();
  setTimeout(() => ring("lon"), 900);
  setTimeout(() => $("welcome").classList.add("show"), 500);
  setTimeout(() => $("welcome").classList.remove("show"), 4500);
};
document.addEventListener("visibilitychange", () => { if (!document.hidden && ac) ac.resume(); });
</script>
